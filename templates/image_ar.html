<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image AR Viewer</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial, sans-serif;
}

/* Camera */

video{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
    z-index:1;
}

/* AR Image */

.arImage{
    position:fixed;
    top:50%;
    left:50%;
    width:300px;
    touch-action:none;
    cursor:grab;
    z-index:10;
}

.arImage img{
    width:100%;
    display:block;
    border-radius:20px;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
}

/* Capture Button */

.captureBtn{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    padding:15px 35px;
    border:none;
    border-radius:50px;
    background:#00BCD4;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    z-index:999;
}

/* Preview Popup */

#previewPopup{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:99999;
}

#previewPopup img{
    max-width:90%;
    max-height:80%;
    border-radius:12px;
}

#closePreview{
    position:absolute;
    top:20px;
    right:30px;
    color:white;
    font-size:35px;
    cursor:pointer;
}

</style>
</head>

<body>

<video id="cam" autoplay playsinline muted></video>

<div class="arImage" id="plate">
    <img src="{{ project.file_url }}" alt="AR Image">
</div>

<button id="captureBtn" class="captureBtn">
📸 Capture
</button>

<div id="previewPopup">
    <span id="closePreview">✕</span>
    <img id="previewImage">
</div>

<script>

/* CAMERA */

const cam = document.getElementById("cam");

navigator.mediaDevices.getUserMedia({
    video:{
        facingMode:"environment"
    }
})
.then(stream=>{
    cam.srcObject = stream;
})
.catch(err=>{
    alert("Camera access denied.");
    console.log(err);
});


/* AR IMAGE */

const plate = document.getElementById("plate");

let x = 0;
let y = 0;
let scale = 1;
let rotation = 0;

let startX;
let startY;
let startDist;
let startAngle;

function update(){

    plate.style.transform = `
        translate(-50%,-50%)
        translate(${x}px,${y}px)
        scale(${scale})
        rotate(${rotation}deg)
    `;
}

update();


/* Mouse Drag */

plate.onmousedown = e=>{

    startX = e.clientX - x;
    startY = e.clientY - y;

    document.onmousemove = e=>{

        x = e.clientX - startX;
        y = e.clientY - startY;

        update();
    };

    document.onmouseup = ()=>{

        document.onmousemove = null;
    };
};


/* Mouse Wheel Zoom */

plate.onwheel = e=>{

    e.preventDefault();

    scale += e.deltaY * -0.001;

    scale = Math.max(0.3, Math.min(scale,4));

    update();
};


/* Touch Start */

plate.addEventListener("touchstart",e=>{

    if(e.touches.length===1){

        startX = e.touches[0].clientX - x;
        startY = e.touches[0].clientY - y;
    }

    if(e.touches.length===2){

        startDist = getDistance(e);
        startAngle = getAngle(e);
    }

},{passive:false});


/* Touch Move */

plate.addEventListener("touchmove",e=>{

    e.preventDefault();

    if(e.touches.length===1){

        x = e.touches[0].clientX - startX;
        y = e.touches[0].clientY - startY;
    }

    if(e.touches.length===2){

        let newDist = getDistance(e);

        scale *= newDist/startDist;
        startDist = newDist;

        scale = Math.max(0.3, Math.min(scale,4));

        let newAngle = getAngle(e);

        rotation += (newAngle - startAngle);

        startAngle = newAngle;
    }

    update();

},{passive:false});


function getDistance(e){

    let dx = e.touches[0].clientX - e.touches[1].clientX;
    let dy = e.touches[0].clientY - e.touches[1].clientY;

    return Math.sqrt(dx*dx + dy*dy);
}

function getAngle(e){

    let dx = e.touches[1].clientX - e.touches[0].clientX;
    let dy = e.touches[1].clientY - e.touches[0].clientY;

    return Math.atan2(dy,dx) * 180 / Math.PI;
}


/* CAPTURE */

document.getElementById("captureBtn").onclick = ()=>{

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    try{

        ctx.drawImage(
            cam,
            0,
            0,
            canvas.width,
            canvas.height
        );

    }catch(err){

        console.log(err);
    }

    const img = plate.querySelector("img");

    const rect = plate.getBoundingClientRect();

    ctx.save();

    ctx.translate(
        rect.left + rect.width/2,
        rect.top + rect.height/2
    );

    ctx.rotate(rotation * Math.PI/180);

    ctx.drawImage(
        img,
        -rect.width/2,
        -rect.height/2,
        rect.width,
        rect.height
    );

    ctx.restore();

    const imageURL = canvas.toDataURL("image/png");

    document.getElementById("previewImage").src = imageURL;
    document.getElementById("previewPopup").style.display = "flex";

    const link = document.createElement("a");

    link.href = imageURL;
    link.download = "AR_Capture.png";

    link.click();
};


/* Close Preview */

document.getElementById("closePreview").onclick = ()=>{

    document.getElementById("previewPopup").style.display = "none";
};

</script>

</body>
</html>
